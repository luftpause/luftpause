services:
  scheduler:
    environment: !override
      Engines__Generative__0__Id: ollama
      Engines__Generative__0__BaseUrl: http://host.docker.internal:11434
      Engines__Generative__0__Models__0: ${OLLAMA_MODEL:-llama3.2:1b}
      Engines__Generative__0__HealthPath: /
    extra_hosts: ["host.docker.internal:host-gateway"]

  dataplane:
    extra_hosts: ["host.docker.internal:host-gateway"]

  runtime:
    environment: !override
      DataPlane__Url: http://dataplane:8080/
      LUFTPAUSE_TOKEN: ${LUFTPAUSE_TOKEN:-}
      Runtime__Model: ${OLLAMA_MODEL:-llama3.2:1b}
      Runtime__DecideModel: ${OLLAMA_MODEL:-llama3.2:1b}
      Tools__Servers__0__Name: wikipedia
      Tools__Servers__0__Command: /opt/tools/bin/wikipedia-mcp
      Tools__Servers__0__Args__0: --transport
      Tools__Servers__0__Args__1: stdio
    depends_on: !override [dataplane]
