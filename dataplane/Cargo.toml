[workspace]
resolver = "2"
members = ["crates/dataplane", "crates/fake-engine", "crates/fake-mcp"]

[workspace.dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[profile.release]
codegen-units = 4
