syntax = "proto3";

package luftpause.v1;

option csharp_namespace = "Luftpause.Protocol.V1";

service Scheduler {
  rpc Admit(TurnRequest) returns (Decision);
  rpc Report(stream TurnEvent) returns (ReportAck);
  rpc Resync(Snapshot) returns (ResyncAck);
}

enum EngineClass {
  ENGINE_CLASS_UNSPECIFIED = 0;
  ENGINE_CLASS_GENERATIVE = 1;
  ENGINE_CLASS_SINGLE_PASS = 2;
}

enum ServiceClass {
  SERVICE_CLASS_UNSPECIFIED = 0;
  SERVICE_CLASS_INTERACTIVE = 1;
  SERVICE_CLASS_BATCH = 2;
}

message TurnRequest {
  string turn_id = 1;
  string run_id = 2;
  EngineClass engine_class = 3;
  string model = 4;
  reserved 5;
  int64 at_unix_ms = 6;
  bool resumed = 7;
  ServiceClass service_class = 8;
  uint32 request_bytes = 9;
  string caller = 10;
}

message Decision {
  reserved 2;
  oneof outcome {
    Route route = 1;
    Refuse refuse = 3;
  }
}

message Route {
  string replica_id = 1;
  string base_url = 2;
  reserved 3;
  string path = 4;
  string authorization = 5;
}

message Refuse {
  string reason = 1;
}

message TurnEvent {
  string turn_id = 1;
  string run_id = 2;
  int64 at_unix_ms = 3;
  oneof kind {
    TurnStarted started = 4;
    FirstToken first_token = 5;
    TurnCompleted completed = 6;
    RunEnded run_ended = 7;
  }
  string trace_id = 8;
  string span_id = 9;
}

message TurnStarted {
  string replica_id = 1;
}

message FirstToken {}

message TurnCompleted {
  string finish_reason = 1;
  uint32 prompt_tokens = 2;
  uint32 completion_tokens = 3;
  uint32 cached_tokens = 4;
  bool failed = 5;
}

message RunEnded {}

message ReportAck {}


enum RunPhase {
  RUN_PHASE_UNSPECIFIED = 0;
  RUN_PHASE_GENERATING = 1;
  RUN_PHASE_AWAITING_TOOL = 2;
  RUN_PHASE_IDLE = 3;
}

message Snapshot {
  repeated RunState runs = 1;
  repeated InFlightTurn turns = 2;
  int64 at_unix_ms = 3;
}

message RunState {
  string run_id = 1;
  RunPhase phase = 2;
  string generating_turn_id = 3;
  int64 phase_since_unix_ms = 4;
  string last_replica_id = 5;
  ServiceClass service_class = 6;
  string caller = 7;
  int64 last_activity_unix_ms = 8;
  int64 started_unix_ms = 9;
  uint32 turns = 10;
}

message InFlightTurn {
  string turn_id = 1;
  string run_id = 2;
  string replica_id = 3;
  ServiceClass service_class = 4;
  string caller = 5;
  int64 started_unix_ms = 6;
}

message ResyncAck {}
